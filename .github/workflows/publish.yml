name: Release to npm

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: lor
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  check-latest: true
                  registry-url: 'https://registry.npmjs.org'

            - name: Update npm
              run: npm install -g npm@11.17.0

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Stage release on npm
              run: npm stage publish
